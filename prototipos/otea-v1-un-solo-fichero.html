<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Otea · mapa diario</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE occasion: a premium daily game, calm and cinematic like a satellite app
   IDEA a living satellite view of a new world every day, with one pink balloon to spot from above
   PICTURE the full-screen WebGL world; the logo is the balloon seen from above, the thing you hunt
   COLOUR the planet's own blues and greens, dark glass instruments, balloon pink #ff3d8b and crown yellow #ffd23f
   TYPE Unbounded for the wordmark and big numbers + Manrope for the interface
   LAYOUT full-bleed map; brand and clock on top; postcard clue bottom-left; zoom bottom-right; scale and coordinates bottom-centre; phone keeps the same corners */
:root{--glass:rgba(12,16,24,.62);--glass2:rgba(12,16,24,.84);--line:rgba(255,255,255,.14);--txt:#f4f6fa;--mut:#a9b2c1;--pink:#ff3d8b;--yel:#ffd23f;color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%;margin:0}
body{background:#0b1b33;color:var(--txt);font:15px/1.45 Manrope,system-ui,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
canvas.full{position:fixed;inset:0;width:100%;height:100%;display:block}
#gl{touch-action:none;cursor:grab}
#gl.drag{cursor:grabbing}
#fx{pointer-events:none}
button{font:inherit;color:inherit;cursor:pointer;margin:0;border:0;background:none}
button:focus-visible,input:focus-visible{outline:2px solid var(--yel);outline-offset:2px}
.g{background:var(--glass);-webkit-backdrop-filter:blur(16px) saturate(1.4);backdrop-filter:blur(16px) saturate(1.4);border:1px solid var(--line);border-radius:14px}
.top{position:fixed;top:0;left:0;right:0;z-index:2;display:flex;align-items:center;gap:8px;padding:max(12px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) 0 max(14px,env(safe-area-inset-left));pointer-events:none}
.top>*{pointer-events:auto}
.brand{height:46px;display:flex;align-items:center;gap:9px;padding:0 14px 0 8px}
.brand svg{width:32px;height:32px;flex:none}
.brand b{font:700 21px/1 Unbounded,sans-serif;letter-spacing:-.02em}
.brand small{font-weight:800;font-size:12px;color:var(--mut);padding-left:2px}
.sp{flex:1}
.clock{height:46px;min-width:92px;display:flex;align-items:center;justify-content:center;font:700 19px/1 Unbounded,sans-serif;font-variant-numeric:tabular-nums;padding:0 14px}
.clock.hit{background:rgba(215,38,61,.75)}
.tbtn{height:46px;padding:0 16px;font-weight:800;display:flex;align-items:center}
.clue{position:fixed;z-index:2;left:max(14px,env(safe-area-inset-left));bottom:max(14px,env(safe-area-inset-bottom));width:min(300px,calc(100vw - 100px));padding:10px;display:flex;flex-direction:column;gap:8px}
.ch{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:800;font-size:13px}
.tabs{display:flex;gap:4px}
.tabs button{font-size:12px;font-weight:800;padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--mut)}
.tabs button.on{background:#fff;color:#0d1118;border-color:#fff}
.pc{display:block;width:100%;aspect-ratio:8/5;border-radius:10px;overflow:hidden;position:relative;border:1px solid var(--line);padding:0}
.pc canvas{width:100%;height:100%;display:block}
.pc span{position:absolute;left:6px;top:6px;font-size:11px;font-weight:800;background:rgba(0,0,0,.5);padding:2px 7px;border-radius:999px}
.tgt{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px}
.tgt svg{width:26px;height:26px;flex:none}
.zone{font-size:12px;color:var(--mut);font-weight:700;margin-top:-4px}
.btn2{height:40px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.08);font-weight:800;font-size:13px}
.btn2[disabled]{opacity:.45;cursor:default}
.ctrl{position:fixed;z-index:2;right:max(14px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px}
.ctrl button{width:48px;height:48px;display:grid;place-items:center;font:500 24px/1 Unbounded,sans-serif}
.ctrl svg{width:20px;height:20px}
.hud{position:fixed;z-index:1;left:50%;transform:translateX(-50%);bottom:max(14px,env(safe-area-inset-bottom));display:flex;align-items:center;gap:14px;padding:8px 14px;font-size:12px;font-weight:700;color:#dfe5ee;white-space:nowrap;font-variant-numeric:tabular-nums}
.sbar{display:flex;align-items:center;gap:8px}
.sbar i{display:block;height:6px;border:2px solid #fff;border-top:0}
.hud .m{color:var(--mut)}
.toast{position:fixed;left:50%;top:72px;z-index:6;transform:translate(-50%,-12px);opacity:0;transition:opacity .2s,transform .2s;background:var(--glass2);border:1px solid var(--line);color:#fff;padding:10px 18px;border-radius:999px;font-weight:800;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.ov{position:fixed;inset:0;z-index:5;background:rgba(5,9,16,.35);display:grid;place-items:center;padding:80px 16px 24px;overflow:auto}
.ov[hidden]{display:none}
.sheet{background:var(--glass2);-webkit-backdrop-filter:blur(22px) saturate(1.4);backdrop-filter:blur(22px) saturate(1.4);border:1px solid var(--line);border-radius:24px;width:min(460px,100%);padding:24px;-webkit-user-select:text;user-select:text}
.logo{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.logo svg{width:52px;height:52px}
.logo b{font:700 34px/1 Unbounded,sans-serif;letter-spacing:-.03em}
.logo span{display:block;font-size:13px;color:var(--mut);font-weight:700;margin-top:4px}
h1{font:700 clamp(26px,7vw,32px)/1.08 Unbounded,sans-serif;letter-spacing:-.02em;margin:0 0 6px;text-wrap:balance}
.meta{color:var(--mut);margin:0 0 16px;font-weight:700;font-size:14px}
ol.steps{margin:0 0 14px;padding:0;list-style:none;display:grid;gap:10px;counter-reset:s}
ol.steps li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start;font-size:15px}
ol.steps li::before{counter-increment:s;content:counter(s);width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.1);font:700 13px/1 Unbounded,sans-serif}
.lineup{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:4px 0 6px}
.lineup figure{margin:0;text-align:center;padding:8px 4px;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid var(--line)}
.lineup figure.ok{background:rgba(255,61,139,.18);border-color:rgba(255,61,139,.6)}
.lineup svg{width:100%;height:54px;display:block}
.lineup figcaption{font-size:12px;font-weight:800;margin-top:4px;line-height:1.2}
.lineup figure.no figcaption{color:#ff8f8f}
label{font-weight:800;font-size:13px;display:block;margin:14px 0 6px;color:var(--mut)}
input{font:inherit;font-size:16px;width:100%;height:48px;border:1px solid rgba(255,255,255,.22);border-radius:12px;padding:0 14px;background:rgba(255,255,255,.06);color:#fff}
.go,.alt{display:flex;width:100%;height:54px;margin-top:12px;justify-content:center;align-items:center;border-radius:14px;font:700 17px/1 Unbounded,sans-serif}
.go{background:var(--pink);color:#fff}
.go:hover{filter:brightness(1.08)}
.alt{background:rgba(255,255,255,.1);border:1px solid var(--line);font-size:15px;height:48px}
.small{font-size:13px;color:var(--mut);margin:10px 0 0;text-align:center;font-weight:600}
.big{font:700 clamp(54px,16vw,76px)/1 Unbounded,sans-serif;font-variant-numeric:tabular-nums;margin:4px 0 6px;color:#fff}
.stats{display:flex;flex-wrap:wrap;gap:6px 16px;font-weight:800;color:var(--mut);font-size:14px}
.bh{display:flex;justify-content:space-between;align-items:baseline;margin:18px 0 6px;font-weight:800}
.bh span{font-size:13px;color:var(--mut)}
.board{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.board li{display:grid;grid-template-columns:2.2em minmax(0,1fr) auto;gap:8px;padding:9px 6px;border-bottom:1px solid var(--line);font-weight:700}
.board li.me{background:rgba(255,61,139,.16)}
.board .p{color:var(--mut)}
.board .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board .t{font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:800}
.bnote{font-size:13px;color:var(--mut);margin:8px 0 0;font-weight:600}
.bigpc{width:100%;border-radius:14px;display:block;border:1px solid var(--line)}
.load{position:fixed;inset:0;z-index:9;display:grid;place-items:center;background:#0b1b33;color:var(--mut);font-weight:800;transition:opacity .5s}
.load div{display:flex;flex-direction:column;align-items:center;gap:14px}
.load svg{width:64px;height:64px;animation:spin 3s linear infinite}
.load.off{opacity:0;pointer-events:none}
@keyframes spin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.load svg{animation:none}}
@media(max-width:640px){
.zone{display:none}
.brand b{font-size:18px}
.brand small{display:none}
.clock{min-width:78px;font-size:17px}
.tbtn{padding:0 12px}
.clue{width:min(200px,calc(100vw - 92px));padding:8px;gap:6px}
.tgt span{font-size:12px}
.btn2{height:36px;font-size:12px}
.hud{left:auto;right:max(14px,env(safe-area-inset-right));transform:none;bottom:auto;top:calc(max(12px,env(safe-area-inset-top)) + 54px);padding:6px 10px}
.hud .c,.hud .m{display:none}
}
</style>
</head>
<body>
<canvas id="gl" class="full" aria-label="Mapa del día: vista de satélite con zoom"></canvas>
<canvas id="fx" class="full" aria-hidden="true"></canvas>

<header class="top">
  <div class="g brand" id="brand"></div>
  <div class="sp"></div>
  <div class="g clock" id="clock">0:00</div>
  <button class="g tbtn" id="rankBtn" type="button">Ranking</button>
</header>

<aside class="g clue" id="clue">
  <div class="ch"><span id="clueT">Postal del día</span><span class="tabs" id="tabs"></span></div>
  <button class="pc" id="pcBtn" type="button" aria-label="Ampliar postal"><canvas id="pc" width="480" height="300"></canvas><span id="pcLab">45 km</span></button>
  <div class="tgt" id="tgt"></div><div class="zone" id="zone"></div>
  <button class="btn2" id="clue2" type="button">Postal más cerca · +20 s</button>
</aside>

<div class="ctrl">
  <button class="g" id="zin" type="button" aria-label="Acercar">+</button>
  <button class="g" id="zout" type="button" aria-label="Alejar">−</button>
  <button class="g" id="home" type="button" aria-label="Ver el mundo entero"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.6 2.6 2.6 14.4 0 17M12 3.5c-2.6 2.6-2.6 14.4 0 17"/></svg></button>
</div>

<div class="g hud" id="hud"><div class="sbar"><i id="sbarL"></i><span id="sbarT">100 km</span></div><span class="c" id="coord"></span><span class="m" id="alt"></span></div>
<div class="toast" id="toast" role="status"></div>
<div class="ov" id="ov" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="load" id="load"><div><span id="loadLogo"></span><span id="loadT">Generando el mundo de hoy…</span></div></div>

const vec3 C1[14]=vec3[14](vec3(1.,.24,.55),vec3(1.,.24,.55),vec3(1.,.24,.55),vec3(1.,.24,.55),vec3(.58,.3,.86),vec3(.86,.16,.14),vec3(.16,.38,.86),vec3(.13,.6,.34),vec3(1.,.5,.12),vec3(.08,.68,.68),vec3(.12,.12,.14),vec3(.86,.16,.14),vec3(.1,.15,.38),vec3(1.,.82,.2));
const vec3 C2[14]=vec3[14](vec3(.96),vec3(.96),vec3(.96),vec3(1.,.82,.25),vec3(.96),vec3(1.,.82,.2),vec3(.96),vec3(.96),vec3(.96),vec3(.96),vec3(1.,.82,.2),vec3(.96),vec3(1.,.5,.12),vec3(.16,.38,.86));
const vec3 CR[14]=vec3[14](vec3(1.,.82,.25),vec3(.96),vec3(.16,.38,.86),vec3(1.,.82,.25),vec3(1.,.82,.25),vec3(.86,.16,.14),vec3(.16,.38,.86),vec3(1.,.82,.2),vec3(1.,.5,.12),vec3(.96),vec3(1.,.82,.2),vec3(.96),vec3(1.,.5,.12),vec3(.16,.38,.86));
const vec3 CROP[6]=vec3[6](vec3(.72,.66,.45),vec3(.45,.54,.29),vec3(.36,.45,.24),vec3(.52,.44,.34),vec3(.63,.56,.42),vec3(.55,.55,.36));
const vec3 CARC[6]=vec3[6](vec3(.92),vec3(.15),vec3(.6,.12,.1),vec3(.2,.3,.6),vec3(.55),vec3(.8,.78,.72));
const vec3 ROOF[5]=vec3[5](vec3(.62,.34,.24),vec3(.5,.5,.51),vec3(.34,.35,.37),vec3(.7,.68,.64),vec3(.55,.3,.22));

uint hsh(ivec2 c,uint s){uint h=(uint(c.x)*0x8da6b343u)^(uint(c.y)*0xd8163841u)^(s*0xcb1ab31fu);h^=h>>16;h*=0x7feb352du;h^=h>>15;h*=0x846ca68bu;h^=h>>16;return h;}

void voro(int i,vec2 d,vec2 off,uint s,out ivec2 id,out vec2 rel,out float d1,out float d2){

  d1=sqrt(d1);d2=sqrt(d2);}

  vec2 w=.045*vec2(N(1,d,uSeed+90u).x,N(1,d,uSeed+91u).x)+.02*vec2(N(2,d,uSeed+92u).x,N(2,d,uSeed+93u).x);

  float h=0.;gr=vec2(0);tex=0.;vec2 ds=vec2(0);
  for(int i=0;i<NO;i++){if(i>=uNO)break;
    ivec2 c;vec2 f;oc(i,d,i<5?w:vec2(0),c,f);vec3 n=nz(c,f,uSeed+uint(i));
    float A;
    if(i<3){A=i==0?1100.:(i==1?650.:380.);}
    else{A=20000./exp2(float(i))*M/(1.+.25*dot(ds,ds));if(i>10)A*=pow(.6,float(i-10));ds+=n.yz;}
    if(i==uNO-1)A*=uFade;

  h+=520.-6500.*max(0.,dc-.2);
  if(dc>.2)gr-=6500.*wp*vec2(1.,1.3225)/max(dc,1e-4);
  return h;}

  for(int i=3;i<9;i++){ivec2 c;vec2 f;oc(i,d,off,c,f);v+=a*nz(c,f,uSeed+300u+uint(i)).x;a*=.52;}
  return v;}

int variant(uint h){uint m=h%20u;if(m<3u)return 1;if(m<5u)return 2;if(m<7u)return 3;if(m<8u)return 4;return 5+int((h/20u)%9u);}

  if(r<1.4){float rr=max(r,.55);float cv=clamp(r*r*1.4+.2,0.,1.)*(1.-smoothstep(rr*.6,rr+.9,length(p)));col=mix(col,mix(C1[v],C2[v],.35)*1.05,cv);return;}

let dirty=true,tw=null,lastMove=0,hiDone=false,curScale=0;
const ZMAX=WM/.01;
const clampZ=z=>Math.min(ZMAX,Math.max(FIT*.8,z));
function clampCam(){cam.x=Math.min(.95,Math.max(.05,cam.x));cam.y=Math.min(.95,Math.max(.05,cam.y))}
function resize(){const first=FIT===800&&cam.z===800;W=innerWidth;H=innerHeight;DPR=Math.min(2,devicePixelRatio||1);FIT=Math.max(260,Math.min(W,H)*1.15);if(first)cam.z=FIT;cam.z=clampZ(cam.z);fx.width=Math.round(W*DPR);fx.height=Math.round(H*DPR);curScale=0;dirty=true}
function setScale(s){const w=Math.round(W*s),h=Math.round(H*s);if(cv.width!==w||cv.height!==h){cv.width=w;cv.height=h}curScale=s}
function draw(scale){if(!prog)return;setScale(scale);renderView(cam.x,cam.y,cam.z,W,H,scale,1,true);overlay();hud()}

/* ---------- overlay: caught decoys, found ring ---------- */
const caught=new Map();
function overlay(){fctx.setTransform(DPR,0,0,DPR,0,0);fctx.clearRect(0,0,W,H);const mpp=WM/cam.z;
  for(const b of caught.values()){const sx=(b.x-cam.x)*cam.z+W/2,sy=(b.y-cam.y)*cam.z+H/2,r=Math.max(12,b.r/mpp*1.25);if(sx<-r||sy<-r||sx>W+r||sy>H+r)continue;
    fctx.strokeStyle='rgba(255,77,90,.95)';fctx.lineWidth=2.5;fctx.beginPath();fctx.arc(sx,sy,r,0,TAU);fctx.stroke();const bx=sx+r*.71,by=sy-r*.71;fctx.fillStyle='#ff4d5a';fctx.beginPath();fctx.arc(bx,by,10,0,TAU);fctx.fill();fctx.strokeStyle='#fff';fctx.lineWidth=2.2;fctx.beginPath();fctx.moveTo(bx-4,by-4);fctx.lineTo(bx+4,by+4);fctx.moveTo(bx+4,by-4);fctx.lineTo(bx-4,by+4);fctx.stroke()}
  if(S.found||mine){const sx=(TG.x-cam.x)*cam.z+W/2,sy=(TG.y-cam.y)*cam.z+H/2,r=Math.max(16,TG.r/mpp*1.4);fctx.strokeStyle=PINK;fctx.lineWidth=3;fctx.setLineDash([8,6]);fctx.beginPath();fctx.arc(sx,sy,r,0,TAU);fctx.stroke();fctx.setLineDash([])}}

/* ---------- HUD ---------- */
function fmtM(m){return m>=1000?(m/1000).toLocaleString('es-ES',{maximumFractionDigits:m>=10000?0:1})+' km':m>=1?Math.round(m)+' m':Math.round(m*100)+' cm'}
function hud(){const mpp=WM/cam.z;const tgt=mpp*110;const p=10**Math.floor(Math.log10(tgt));const nice=[1,2,5,10].map(k=>k*p).filter(v=>v<=tgt).pop()||p;
  $('#sbarL').style.width=(nice/mpp).toFixed(1)+'px';$('#sbarT').textContent=fmtM(nice);
  const lat=43.9-cam.y*3.6,lon=-2.4+cam.x*4.85;$('#coord').textContent=lat.toFixed(5).replace('.',',')+'° N · '+Math.abs(lon).toFixed(5).replace('.',',')+'° '+(lon<0?'O':'E');
  $('#alt').textContent='altitud '+fmtM(W*mpp*.9)}

/* ---------- postcards ---------- */
const PW=480,PH=300;let pcA=null,pcB=null;
function postcard(P){const fb=gl.createFramebuffer(),tx=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,tx);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,PW,PH,0,gl.RGBA,gl.UNSIGNED_BYTE,null);gl.bindFramebuffer(gl.FRAMEBUFFER,fb);gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,tx,0);
  const z=PW*WM/P.w;renderView(P.x,P.y,z,PW,PH,1,0,true);const px=new Uint8Array(PW*PH*4);gl.readPixels(0,0,PW,PH,gl.RGBA,gl.UNSIGNED_BYTE,px);gl.bindFramebuffer(gl.FRAMEBUFFER,null);gl.deleteFramebuffer(fb);gl.deleteTexture(tx);
  const c=document.createElement('canvas');c.width=PW;c.height=PH;const x=c.getContext('2d'),im=x.createImageData(PW,PH);for(let r=0;r<PH;r++)im.data.set(px.subarray((PH-1-r)*PW*4,(PH-r)*PW*4),r*PW*4);x.putImageData(im,0,0);
  const mpp=P.w/PW,tgt=mpp*90,p=10**Math.floor(Math.log10(tgt)),nice=[1,2,5,10].map(k=>k*p).filter(v=>v<=tgt).pop()||p,L=nice/mpp;
  x.fillStyle='rgba(10,14,22,.62)';x.fillRect(10,PH-34,L+86,24);x.strokeStyle='#fff';x.lineWidth=2;x.beginPath();x.moveTo(18,PH-26);x.lineTo(18,PH-18);x.lineTo(18+L,PH-18);x.lineTo(18+L,PH-26);x.stroke();x.fillStyle='#fff';x.font='700 13px Manrope,sans-serif';x.fillText(fmtM(nice),26+L,PH-17);
  x.fillStyle='rgba(10,14,22,.62)';x.beginPath();x.arc(PW-24,24,14,0,TAU);x.fill();x.fillStyle='#fff';x.font='800 12px Manrope,sans-serif';x.textAlign='center';x.fillText('N',PW-24,29);
  return c}
let showB=false;
function showCard(){const c=showB&&pcB?pcB:pcA;if(!c)return;const pc=$('#pc');pc.getContext('2d').drawImage(c,0,0);$('#pcLab').textContent=showB?'3,2 km':'45 km';$('#clueT').textContent=showB?'Postal cercana':'Postal del día';
  const t=$('#tabs');t.innerHTML=S.clue2?'<button type="button" data-b="0">1</button><button type="button" data-b="1">2</button>':'';t.querySelectorAll('button').forEach(b=>{b.classList.toggle('on',(b.dataset.b==='1')===showB);b.onclick=()=>{showB=b.dataset.b==='1';showCard()}})}
$('#pcBtn').onclick=()=>{const c=showB&&pcB?pcB:pcA;if(!c)return;open(`<h1>${showB?'Postal cercana':'Postal del día'}</h1><p class="meta">${showB?'Una vista de 3,2 km: el globo está en ella.':'Una vista de 45 km en '+ZONE+': el globo está en algún punto de esta imagen. Busca este sitio en el mapa.'}</p><img class="bigpc" alt="Postal de la zona donde está el globo" src="${c.toDataURL('image/jpeg',.9)}"><button class="alt" id="back" type="button">Volver al mapa</button>`);$('#back').onclick=close};
$('#clue2').onclick=()=>{if(S.phase!=='play'||S.clue2)return;S.clue2=true;S.hints=1;penalty();showB=true;showCard();updClue();toast('Postal cercana · +20 s')};
function updClue(){const b=$('#clue2');b.disabled=S.phase!=='play'||S.clue2;b.textContent=S.clue2?'Postal cercana desbloqueada':'Postal más cerca · +20 s'}

/* ---------- game state ---------- */
const S={phase:'intro',t0:0,fails:0,hints:0,clue2:false,found:false,ms:0};
let mine=null,alias='';
try{alias=localStorage.getItem('otea-alias')||''}catch(e){}
try{const l=JSON.parse(localStorage.getItem('otea-run-'+ISO)||'null');if(l&&l.day===ISO)mine=l}catch(e){}
const total=()=>S.found?S.ms:S.phase==='play'?Date.now()-S.t0+S.fails*5000+S.hints*20000:(mine?mine.ms:0);
function fmt(ms){const s=Math.floor(ms/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
let lastClock='';function updClock(){const t=fmt(total());if(t!==lastClock){lastClock=t;$('#clock').textContent=t}}
let toastT=0;function toast(m){const e=$('#toast');e.textContent=m;e.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove('on'),2000)}
function penalty(){const c=$('#clock');c.classList.add('hit');setTimeout(()=>c.classList.remove('hit'),600)}

/* ---------- camera moves + input ---------- */
function zoomAt(px,py,f){const wx=cam.x+(px-W/2)/cam.z,wy=cam.y+(py-H/2)/cam.z;cam.z=clampZ(cam.z*f);cam.x=wx-(px-W/2)/cam.z;cam.y=wy-(py-H/2)/cam.z;clampCam();dirty=true}
function zoomTo(x,y,z,ms=900){tw={x0:cam.x,y0:cam.y,z0:cam.z,x1:x,y1:y,z1:clampZ(z),t0:performance.now(),ms}}
$('#zin').onclick=()=>zoomTo(cam.x,cam.y,cam.z*2.5,380);
$('#zout').onclick=()=>zoomTo(cam.x,cam.y,cam.z/2.5,380);
$('#home').onclick=()=>zoomTo(.5,.5,FIT,1100);
const P=new Map();let down=null,pinch=null,lastTap=0;
cv.addEventListener('pointerdown',e=>{try{cv.setPointerCapture(e.pointerId)}catch(_){}P.set(e.pointerId,{x:e.clientX,y:e.clientY});tw=null;
  if(P.size===1)down={x:e.clientX,y:e.clientY,t:performance.now(),moved:false};
  if(P.size===2){const v=[...P.values()];pinch={d:Math.hypot(v[0].x-v[1].x,v[0].y-v[1].y),mx:(v[0].x+v[1].x)/2,my:(v[0].y+v[1].y)/2};if(down)down.moved=true}
  cv.classList.add('drag')});
cv.addEventListener('pointermove',e=>{const p=P.get(e.pointerId);if(!p)return;const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;
  if(P.size===1){cam.x-=dx/cam.z;cam.y-=dy/cam.z;if(down&&Math.hypot(e.clientX-down.x,e.clientY-down.y)>7)down.moved=true}
  else if(P.size===2&&pinch){const v=[...P.values()],d=Math.hypot(v[0].x-v[1].x,v[0].y-v[1].y),mx=(v[0].x+v[1].x)/2,my=(v[0].y+v[1].y)/2;cam.x-=(mx-pinch.mx)/cam.z;cam.y-=(my-pinch.my)/cam.z;if(pinch.d>0)zoomAt(mx,my,d/pinch.d);pinch.d=d;pinch.mx=mx;pinch.my=my}
  clampCam();dirty=true});
function up(e){if(!P.delete(e.pointerId))return;if(P.size<2)pinch=null;if(P.size===1)down=null;
  if(P.size===0){cv.classList.remove('drag');if(down&&!down.moved&&performance.now()-down.t<450){const now=performance.now(),x=e.clientX,y=e.clientY;if(!tap(x,y)){if(now-lastTap<330){lastTap=0;const wx=cam.x+(x-W/2)/cam.z,wy=cam.y+(y-H/2)/cam.z,z1=clampZ(cam.z*3);zoomTo(wx-(x-W/2)/z1,wy-(y-H/2)/z1,z1,420)}else lastTap=now}}down=null}}
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
cv.addEventListener('wheel',e=>{e.preventDefault();tw=null;zoomAt(e.clientX,e.clientY,Math.exp(-e.deltaY*(e.ctrlKey?.012:.0022)))},{passive:false});
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'||!$('#ov').hidden)return;const st=90/cam.z;
  if(e.key==='+'||e.key==='=')$('#zin').onclick();else if(e.key==='-')$('#zout').onclick();else if(e.key==='ArrowLeft')cam.x-=st;else if(e.key==='ArrowRight')cam.x+=st;else if(e.key==='ArrowUp')cam.y-=st;else if(e.key==='ArrowDown')cam.y+=st;else return;clampCam();dirty=true});

function tap(px,py){if(S.phase==='intro')return false;const mpp=WM/cam.z,wx=cam.x+(px-W/2)/cam.z,wy=cam.y+(py-H/2)/cam.z,tol=8*mpp;
  if(Math.hypot(wx-TG.x,wy-TG.y)*WM<TG.r*1.25+tol){if(TG.r/mpp<4){toast('Acércate más para comprobar ese globo');return true}if(S.phase==='play')win();else toast('Ese es el globo de hoy');return true}
  const f=FQ[8],cx=Math.floor((wx+8)*f),cy=Math.floor((wy+8)*f);
  for(let j=-1;j<=1;j++)for(let i=-1;i<=1;i++){const X=cx+i,Y=cy+j;if(X===TCELL[0]&&Y===TCELL[1])continue;const b=balloonAt(X,Y);if(!b)continue;
    if(Math.hypot(wx-b.x,wy-b.y)*WM<b.r*1.25+tol){if(b.r/mpp<4){toast('Acércate más para comprobar ese globo');return true}
      if(caught.has(b.key)){toast('Ese impostor ya está marcado');return true}
      caught.set(b.key,b);dirty=true;if(S.phase==='play'){S.fails++;penalty();toast('Impostor · +5 s')}else toast('Impostor');return true}}
  return false}

/* ---------- finish + share ---------- */
function win(){S.found=true;S.ms=Date.now()-S.t0+S.fails*5000+S.hints*20000;S.phase='done';updClock();updClue();dirty=true;
  const run={day:ISO,ms:S.ms,fails:S.fails,hints:S.hints,alias:alias||'Anónimo',at:Date.now()};
  if(!mine){mine=run;try{localStorage.setItem('otea-run-'+ISO,JSON.stringify(run))}catch(e){}submit(run)}
  setTimeout(()=>showResult(true),900)}
function shareText(){const m=mine||S;return'Otea #'+DAY+' · '+fmt(m.ms)+'\n'+'🟥'.repeat(m.fails||0)+'🟨'.repeat(m.hints||0)+((m.fails||m.hints)?'':'🟩')+'\nHe encontrado el globo rosa. ¿Y tú?'}
function nextMap(){const p=new Intl.DateTimeFormat('en-GB',{timeZone:TZ,hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'}).formatToParts(new Date()),g=k=>+(p.find(x=>x.type===k)||{value:0}).value,left=86400-(g('hour')*3600+g('minute')*60+g('second'));return'Nuevo mundo en '+Math.floor(left/3600)+' h '+Math.floor(left%3600/60)+' min · a medianoche, hora de Madrid'}

/* ---------- sheets ---------- */
const ov=$('#ov'),sheet=$('#sheet');
function open(html){sheet.innerHTML=html;ov.hidden=false;renderBoard()}
function close(){ov.hidden=true}
const lineup=`<div class="lineup"><figure class="ok">${balloonSVG(PINK,WHITE,YEL)}<figcaption>El bueno</figcaption></figure><figure class="no">${balloonSVG(PINK,WHITE,WHITE)}<figcaption>Corona blanca</figcaption></figure><figure class="no">${balloonSVG(PINK,WHITE,'#2961db')}<figcaption>Corona azul</figcaption></figure><figure class="no">${balloonSVG(PINK,YEL,YEL)}<figcaption>Gajos amarillos</figcaption></figure></div>`;
const boardBlock=`<div class="bh">Ranking de hoy<span id="bcount"></span></div><ol class="board" id="board"></ol><p class="bnote" id="bnote"></p>`;
const logoBlock=`<div class="logo">${LOGO()}<div><b>otea</b><span>Mundo #${DAY} · ${DATEL}</span></div></div>`;
function showIntro(){S.phase='intro';updClue();open(`${logoBlock}<h1>Encuentra el globo rosa</h1><p class="meta">Otear: mirar a lo lejos desde un sitio alto. Un mundo nuevo cada día, el mismo para todos.</p><ol class="steps"><li>Mira la postal: el globo está en esa zona.</li><li>Busca ese sitio en el mapa y acércate. El zoom llega hasta los centímetros.</li><li>Toca el globo rosa con corona amarilla. Hay muchos parecidos y cada impostor suma 5 s.</li></ol>${lineup}<label for="alias">Tu nombre en el ranking</label><input id="alias" maxlength="18" autocomplete="nickname" placeholder="Por ejemplo, Bernu"><button class="go" id="go" type="button">Empezar</button><p class="small">El cronómetro arranca al pulsar. La postal cercana suma 20 s.</p>`);
  const a=$('#alias');a.value=alias;$('#go').onclick=start;a.addEventListener('keydown',e=>{if(e.key==='Enter')start()})}
function start(){const a=$('#alias');if(a){alias=a.value.trim().slice(0,18);try{localStorage.setItem('otea-alias',alias)}catch(e){}}
  if(mine){showResult(false);return}
  close();S.phase='play';S.t0=Date.now();S.fails=0;S.hints=0;S.clue2=false;S.found=false;updClue();showCard();zoomTo(.5,.5,FIT,400)}
function showResult(fresh){const m=mine||S;if(!S.found&&S.phase!=='play')S.phase='done';updClue();updClock();
  const lat=43.9-TG.y*3.6,lon=-2.4+TG.x*4.85;
  open(`${logoBlock}<h1>${fresh?'¡Avistado!':'Hoy ya lo encontraste'}</h1><div class="big">${fmt(m.ms)}</div><div class="stats"><span>${m.fails||0} impostor${(m.fails||0)===1?'':'es'}</span><span>${m.hints?'con postal cercana':'sin pistas'}</span><span>${lat.toFixed(4).replace('.',',')}° N, ${Math.abs(lon).toFixed(4).replace('.',',')}° ${lon<0?'O':'E'}</span></div>${boardBlock}<button class="go" id="share" type="button">Copiar resultado</button><button class="alt" id="explore" type="button">Ver el globo y explorar</button><p class="small">${nextMap()}</p>`);
  $('#share').onclick=async()=>{try{await navigator.clipboard.writeText(shareText());toast('Resultado copiado')}catch(e){toast('No se pudo copiar')}};
  $('#explore').onclick=()=>{close();zoomTo(TG.x,TG.y,WM/.35,1400)}}
function showRanking(){open(`<h1>Ranking de hoy</h1><p class="meta">Mundo #${DAY} · ${DATEL}</p>${boardBlock}<button class="alt" id="back" type="button">${S.phase==='intro'?'Volver':'Volver al mapa'}</button>`);$('#back').onclick=()=>{S.phase==='intro'?showIntro():(mine&&S.phase!=='play'?showResult(false):close())}}
$('#rankBtn').onclick=showRanking;

/* ---------- shared ranking ---------- */
let db=null,uid=null,board=[],dbState='wait',dbTimer=0;
const val=d=>d==null?null:(typeof d.data==='function'?(d.exists===false?null:d.data()):d);
function docsOf(s){if(!s)return[];if(Array.isArray(s))return s.map(val).filter(Boolean);if(Array.isArray(s.docs))return s.docs.map(val).filter(Boolean);return[]}
function row(pos,name,ms,me){const li=document.createElement('li');if(me)li.className='me';const a=document.createElement('span');a.className='p';a.textContent=pos+'.';const b=document.createElement('span');b.className='n';b.textContent=String(name||'Anónimo').slice(0,18);const c=document.createElement('span');c.className='t';c.textContent=fmt(ms);li.append(a,b,c);return li}
function renderBoard(){const ol=$('#board'),note=$('#bnote'),cnt=$('#bcount');if(!ol)return;ol.textContent='';
  let rows=board.filter(r=>r&&r.day===ISO&&typeof r.ms==='number').sort((a,b)=>a.ms-b.ms);
  if(dbState!=='on'&&mine)rows=[Object.assign({u:'local'},mine)];
  rows.slice(0,10).forEach((r,i)=>ol.append(row(i+1,r.alias,r.ms,(uid&&r.u===uid)||r.u==='local')));
  if(uid&&dbState==='on'){const pos=rows.findIndex(r=>r.u===uid);if(pos>=10)ol.append(row(pos+1,rows[pos].alias,rows[pos].ms,true))}
  if(cnt)cnt.textContent=dbState==='on'?rows.length+(rows.length===1?' jugador':' jugadores'):'';
  note.textContent=dbState==='on'?(rows.length?'':'Aún no hay tiempos hoy. Sé el primero.'):dbState==='wait'?'Cargando ranking…':dbState==='err'?'No se pudo cargar el ranking. Tu tiempo queda guardado en este navegador.':'El ranking compartido aparece al jugar con tu cuenta de Claude. Aquí solo ves tu tiempo.'}
async function submit(run){if(!db||!uid)return;try{await db.doc('otea/'+uid).set(Object.assign({u:uid},run))}catch(e){toast('Tu tiempo no se pudo subir al ranking')}}
async function initDB(late){const cl=window.claude;if(!cl||typeof cl.use!=='function'){if(!late)setTimeout(()=>initDB(true),1500);else{dbState='off';renderBoard()}return}
  dbTimer=setTimeout(()=>{if(dbState==='wait'){dbState='err';renderBoard()}},10000);
  try{db=await cl.use('db');const user=await cl.use('user');if(db&&user)uid=await user.id()}catch(e){db=null}
  if(!db||!uid){clearTimeout(dbTimer);dbState='off';renderBoard();return}
  try{const d=val(await db.doc('otea/'+uid).get());if(d&&d.day===ISO){mine=d;if(S.phase==='intro'){S.phase='done';showResult(false)}}else if(mine&&mine.day===ISO)submit(mine)}catch(e){}
  const q=db.collection('otea').where('day','==',ISO);const got=s=>{clearTimeout(dbTimer);dbState='on';board=docsOf(s);renderBoard()};
  try{q.onSnapshot(got,()=>{clearTimeout(dbTimer);dbState='err';renderBoard()})}catch(e){try{got(await q.get())}catch(_){clearTimeout(dbTimer);dbState='err';renderBoard()}}}

/* ---------- loop ---------- */
let lastT=0;
function frame(t){requestAnimationFrame(frame);
  if(tw){const k=Math.min(1,(t-tw.t0)/tw.ms),e=k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;const l0=Math.log(tw.z0),l1=Math.log(tw.z1);cam.z=Math.exp(l0+(l1-l0)*e);
    const sx=(1/tw.z0-1/cam.z)/((1/tw.z0-1/tw.z1)||1);const m=Math.abs(l1-l0)<.01?e:Math.min(1,Math.max(0,sx));cam.x=tw.x0+(tw.x1-tw.x0)*m;cam.y=tw.y0+(tw.y1-tw.y0)*m;if(k>=1)tw=null;dirty=true}
  if(t-lastT>250){lastT=t;updClock()}
  const now=performance.now();
  if(dirty){dirty=false;draw(LO);lastMove=now;hiDone=false}
  else if(!hiDone&&now-lastMove>140){hiDone=true;draw(HI)}}
addEventListener('resize',resize);
resize();updClue();
function boot(d){if(d&&d.day===ISO&&d.S){Object.assign(S,d.S);if(d.cam)Object.assign(cam,d.cam)}
  if(prog){draw(HI);hiDone=true;pcA=postcard(PA);pcB=postcard(PB);showCard();dirty=true}
  setTimeout(()=>{if(prog)$('#load').classList.add('off')},60);
  if(S.phase==='play'){close();updClue()}else if(mine)showResult(false);else showIntro();
  requestAnimationFrame(frame);initDB(false)}
try{window.claude?.hot?.snapshot?.(()=>({day:ISO,S:{phase:S.phase,t0:S.t0,fails:S.fails,hints:S.hints,clue2:S.clue2,found:false,ms:S.ms},cam:{x:cam.x,y:cam.y,z:cam.z}}))}catch(e){}
setTimeout(()=>{if(window.claude?.hot?.ready)window.claude.hot.ready(boot);else boot(window.claude?.hot?.data??{})},30);
}
</script>
</body>
</html>
